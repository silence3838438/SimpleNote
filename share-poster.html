<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小獭记账 - 分享图 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            padding: 40px;
        }

        .poster {
            width: 500px;
            height: 400px;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 动态背景 */
        .dynamic-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(82, 196, 26, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(115, 209, 61, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(82, 196, 26, 0.03) 0%, transparent 70%);
            filter: blur(40px);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* 3D网格背景 */
        .grid-3d {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(82, 196, 26, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(82, 196, 26, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center bottom;
            opacity: 0.4;
        }

        /* 玻璃拟态容器 */
        .glass-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            height: 340px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Logo区域 - 3D效果 */
        .logo-3d {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #52C41A 0%, #73D13D 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 
                0 8px 24px rgba(82, 196, 26, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(82, 196, 26, 0.3), rgba(115, 209, 61, 0.3));
            border-radius: 16px;
            z-index: -1;
            filter: blur(8px);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }

        .brand-tag {
            font-size: 9px;
            color: rgba(82, 196, 26, 0.7);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* 主标题 */
        .hero-title {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1.5px;
        }

        .hero-highlight {
            background: linear-gradient(135deg, #52C41A 0%, #73D13D 50%, #52C41A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .hero-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.8;
            margin-bottom: 0;
            font-weight: 400;
        }

        /* 装饰光点 */
        .light-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #52C41A;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(82, 196, 26, 0.8);
            animation: float 4s ease-in-out infinite;
        }

        .dot-1 { top: 15%; left: 10%; animation-delay: 0s; }
        .dot-2 { top: 25%; right: 15%; animation-delay: 1s; }
        .dot-3 { bottom: 20%; left: 20%; animation-delay: 2s; }
        .dot-4 { bottom: 30%; right: 10%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); opacity: 0.3; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        /* 说明文字 */
        .instructions {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 13px;
            line-height: 1.8;
        }

        .instructions p {
            margin: 6px 0;
        }

        .instructions strong {
            color: #52C41A;
            font-weight: 600;
        }

        .instructions .tip {
            color: #888;
            font-size: 11px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div>
        <div class="poster" id="poster">
            <!-- 动态背景 -->
            <div class="dynamic-bg"></div>
            <div class="grid-3d"></div>

            <!-- 装饰光点 -->
            <div class="light-dot dot-1"></div>
            <div class="light-dot dot-2"></div>
            <div class="light-dot dot-3"></div>
            <div class="light-dot dot-4"></div>

            <!-- 玻璃拟态容器 -->
            <div class="glass-container">
                <!-- Logo -->
                <div class="logo-3d">
                    <div class="logo-icon">🦦</div>
                    <div class="brand-text">
                        <div class="brand-name">小獭记账</div>
                        <div class="brand-tag">SMART TECH</div>
                    </div>
                </div>

                <!-- 主标题 -->
                <div class="hero-title">
                    <span class="hero-highlight">3秒</span>完成<br>
                    智能记账
                </div>

                <div class="hero-subtitle">
                    语音识别 · 拍照解析 · 智能分类<br>
                    让每一笔消费都清晰可见
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>📸 生成分享图</strong></p>
            <p>1. 在Chrome浏览器中打开此页面</p>
            <p>2. 按F12打开开发者工具 → 截图工具 → 截取节点（500×400px）</p>
            <p>3. 保存为 <strong>shareLine.png</strong> → 替换到 <strong>/static/shareLine.png</strong></p>
            <p class="tip">💡 使用开发者工具截图可获得最佳质量和精确尺寸</p>
        </div>
    </div>
</body>
</html>
