# 管理后台 Nginx 配置
# 将此配置添加到服务器的 /etc/nginx/conf.d/admin.conf

# 管理后台
location /admin {
    alias /www/admin;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    
    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

